spring.application.name=Dentify
server.port=${PORT:8080}

# Configuracion de la base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dentify?sslMode=DISABLED&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
security.jwt.secret=${JWT_SECRET:clave_secreta_jwt_de_al_menos_32_caracteres_super_segura}
