name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    # MySQL efímero solo para pruebas: las pruebas de integración (las que requieren DB_URL)
    # se ejecutan en CI en lugar de omitirse. Cada clase crea su propia base aislada.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: dentify_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/dentify_it?sslMode=DISABLED&allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: root
          DB_PASSWORD: ci-test-only
